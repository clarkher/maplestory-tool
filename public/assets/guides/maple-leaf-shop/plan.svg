<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="720" height="1440" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a7a66"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f8a4e"/></marker>
  </defs>
  <rect width="360" height="720" rx="16" fill="#fff8ee"/>
  <text x="180" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#3a2a1a">楓葉商會懶人包：一天 100 枚怎麼花</text>
  <text x="180" y="50" text-anchor="middle" font-size="12" fill="#7a6650">一天換一張卷；70%、15% 一張另付 30 萬楓幣</text>

  <!-- step 1 -->
  <rect x="12" y="66" width="208" height="56" rx="10" fill="#ffffff" stroke="#d9c6ad"/>
  <rect x="20" y="74" width="62" height="20" rx="10" fill="#3a2a1a"/>
  <text x="51" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DAY 1–2</text>
  <text x="20" y="113" font-size="14" fill="#3a2a1a">換一把 43 級楓葉武器</text>

  <line x1="116" y1="122" x2="116" y2="140" stroke="#8a7a66" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- step 2: 15% -->
  <rect x="12" y="142" width="208" height="56" rx="10" fill="#fff1e2" stroke="#e8740c"/>
  <rect x="20" y="150" width="62" height="20" rx="10" fill="#e8740c"/>
  <text x="51" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DAY 3</text>
  <text x="20" y="189" font-size="14" fill="#3a2a1a">衝一張 <tspan font-weight="700" fill="#c25a00">15%</tspan></text>

  <line x1="116" y1="198" x2="116" y2="216" stroke="#8a7a66" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="122" y="211" font-size="12" fill="#7a6650">沒中</text>

  <!-- step 3: 15% again -->
  <rect x="12" y="218" width="208" height="56" rx="10" fill="#fff1e2" stroke="#e8740c"/>
  <rect x="20" y="226" width="62" height="20" rx="10" fill="#e8740c"/>
  <text x="51" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DAY 4</text>
  <text x="20" y="265" font-size="14" fill="#3a2a1a">再衝一張 <tspan font-weight="700" fill="#c25a00">15%</tspan></text>

  <!-- hit branch from step2/3 to result 1 -->
  <path d="M220 170 H246 V214" fill="none" stroke="#2f8a4e" stroke-width="1.6"/>
  <path d="M220 246 H246" fill="none" stroke="#2f8a4e" stroke-width="1.6"/>
  <line x1="246" y1="214" x2="246" y2="246" stroke="#2f8a4e" stroke-width="1.6"/>
  <text x="226" y="164" font-size="12" font-weight="700" fill="#2f8a4e">中</text>
  <text x="226" y="240" font-size="12" font-weight="700" fill="#2f8a4e">中</text>
  <line x1="246" y1="230" x2="256" y2="230" stroke="#2f8a4e" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="258" y="166" width="94" height="128" rx="10" fill="#e8f5ec" stroke="#2f8a4e"/>
  <text x="305" y="186" text-anchor="middle" font-size="12" fill="#2f8a4e">剩下每天</text>
  <text x="305" y="202" text-anchor="middle" font-size="12" fill="#2f8a4e">一張 70%</text>
  <text x="305" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b3a">DAY 9</text>
  <text x="305" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6b3a">衝完收工</text>
  <text x="305" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#3a2a1a">27.7%</text>
  <text x="305" y="286" text-anchor="middle" font-size="11" fill="#7a6650">平均 +12.8</text>

  <line x1="116" y1="274" x2="116" y2="306" stroke="#8a7a66" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="122" y="294" font-size="12" fill="#7a6650">兩張都沒中：這把放著</text>

  <!-- weapon 2 -->
  <rect x="12" y="308" width="208" height="70" rx="10" fill="#ffffff" stroke="#d9c6ad"/>
  <rect x="20" y="316" width="62" height="20" rx="10" fill="#3a2a1a"/>
  <text x="51" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DAY 5–8</text>
  <text x="20" y="355" font-size="14" fill="#3a2a1a">換第 2 把，照上面重來</text>
  <text x="20" y="372" font-size="12" fill="#7a6650">2 天換武器＋2 張 15%</text>
  <line x1="220" y1="343" x2="256" y2="343" stroke="#2f8a4e" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="226" y="337" font-size="12" font-weight="700" fill="#2f8a4e">中</text>
  <rect x="258" y="308" width="94" height="70" rx="10" fill="#e8f5ec" stroke="#2f8a4e"/>
  <text x="305" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b3a">DAY 13</text>
  <text x="305" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#3a2a1a">20.0%</text>
  <text x="305" y="369" text-anchor="middle" font-size="11" fill="#7a6650">平均 +12.8</text>

  <line x1="116" y1="378" x2="116" y2="406" stroke="#8a7a66" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="122" y="396" font-size="12" fill="#7a6650">還是沒中</text>

  <!-- weapon 3 -->
  <rect x="12" y="408" width="208" height="70" rx="10" fill="#ffffff" stroke="#d9c6ad"/>
  <rect x="20" y="416" width="66" height="20" rx="10" fill="#3a2a1a"/>
  <text x="53" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DAY 9–12</text>
  <text x="20" y="455" font-size="14" fill="#3a2a1a">換第 3 把，照上面重來</text>
  <text x="20" y="472" font-size="12" fill="#7a6650">2 天換武器＋2 張 15%</text>
  <line x1="220" y1="443" x2="256" y2="443" stroke="#2f8a4e" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="226" y="437" font-size="12" font-weight="700" fill="#2f8a4e">中</text>
  <rect x="258" y="408" width="94" height="70" rx="10" fill="#e8f5ec" stroke="#2f8a4e"/>
  <text x="305" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b3a">DAY 17</text>
  <text x="305" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#3a2a1a">14.5%</text>
  <text x="305" y="469" text-anchor="middle" font-size="11" fill="#7a6650">平均 +12.8</text>

  <line x1="116" y1="478" x2="116" y2="506" stroke="#8a7a66" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="122" y="496" font-size="12" fill="#7a6650">六張 15% 全沒中</text>

  <!-- weapon 4 -->
  <rect x="12" y="508" width="208" height="88" rx="10" fill="#eef2f8" stroke="#5a7aa8"/>
  <rect x="20" y="516" width="74" height="20" rx="10" fill="#5a7aa8"/>
  <text x="57" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DAY 13–21</text>
  <text x="20" y="556" font-size="14" fill="#3a2a1a">換第 4 把，不賭了</text>
  <text x="20" y="574" font-size="14" fill="#3a2a1a">每天一張 <tspan font-weight="700" fill="#2f4f7a">70%</tspan>，7 張衝滿</text>
  <text x="20" y="590" font-size="12" fill="#7a6650">DAY 13–14 換武器、15–21 衝卷</text>
  <line x1="220" y1="552" x2="256" y2="552" stroke="#2f8a4e" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="258" y="508" width="94" height="88" rx="10" fill="#e8f5ec" stroke="#2f8a4e"/>
  <text x="305" y="532" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b3a">DAY 21</text>
  <text x="305" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#3a2a1a">37.7%</text>
  <text x="305" y="574" text-anchor="middle" font-size="11" fill="#7a6650">平均 +9.8</text>

  <!-- footer -->
  <rect x="12" y="612" width="336" height="94" rx="10" fill="#3a2a1a"/>
  <text x="24" y="636" font-size="13" fill="#f4e6d2">整條路走完：平均攻擊 <tspan font-weight="700" fill="#ffb366">+11.6</tspan></text>
  <text x="24" y="658" font-size="13" fill="#f4e6d2">+12 以上的機會 <tspan font-weight="700" fill="#ffb366">53%</tspan>（只換一把全衝 70% 是 33%）</text>
  <text x="24" y="680" font-size="13" fill="#f4e6d2">楓幣先存 <tspan font-weight="700" fill="#ffb366">390 萬</tspan>就走得完</text>
  <text x="24" y="698" font-size="11" fill="#bba88f">前提：每天拿滿 100 枚、當天換當天衝</text>
</svg>
