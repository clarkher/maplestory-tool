<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /*BASE_CSS*/
      /* Shorts 1080×1920：同一套零件直式重排。
         上三分之一＝標題／卡片、中間＝角色或官方圖、下三分之一＝字幕、跑馬燈在 Shorts 介面上方 */
      html, body { width: 1080px; height: 1920px; }
      #root { width: 1080px; height: 1920px; }

      #bg .bg-frame { left: 0; top: 0; width: 1080px; height: 1500px; }
      #bg .bg-dim {
        background:
          linear-gradient(180deg, rgba(13, 15, 20, 0.9) 0%, rgba(13, 15, 20, 0.82) 42%, rgba(13, 15, 20, 0.2) 68%, #0d0f14 100%),
          rgba(13, 15, 20, 0.3);
      }

      #open .bar { top: 250px; height: 96px; }
      #open .bar .red { padding: 0 34px 0 108px; font-size: 52px; letter-spacing: 8px; }
      #open .bar .yel { padding: 0 30px; font-size: 44px; }
      #open .o-text { position: absolute; left: 108px; top: 400px; width: 864px; display: flex; flex-direction: column; gap: 34px; }
      #open .sub { padding-left: 4px; font-size: 48px; line-height: 1.3; }

      #hdr .bar { top: 128px; height: 60px; }
      #hdr .bar .red { padding: 0 22px 0 108px; font-size: 32px; letter-spacing: 5px; }
      #hdr .bar .yel { padding: 0 20px; font-size: 28px; }

      #brand .brand-in { right: 60px; top: 122px; font-size: 34px; }
      #brand .brand-in img { width: 64px; height: 64px; }

      .card { left: 108px; top: 300px; width: 864px; height: 520px; gap: 26px; }
      .card .line { font-size: 46px; line-height: 1.3; }
      .seg-title { position: absolute; left: 108px; top: 260px; width: 864px; height: 380px; display: flex; flex-direction: column; justify-content: center; }

      .cap { bottom: 380px; }

      #end .end-in { gap: 18px; padding-bottom: 240px; }
      #end .end-in img { width: 200px; height: 200px; }
      #end .end-lead { font-size: 52px; }

      #ticker .tk-bar { top: 1600px; height: 110px; }
      #ticker .tk-track { padding-left: 108px; gap: 54px; font-size: 40px; }
    </style>
  </head>
  <body>
    <!--BODY-->
    <script>
      /*TIMELINE*/
    </script>
  </body>
</html>
