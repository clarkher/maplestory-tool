<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /*BASE_CSS*/
      /* 正片 1920×1080：版面照 s2 拍板稿 */
      html, body { width: 1920px; height: 1080px; }
      #root { width: 1920px; height: 1080px; }

      #bg .bg-frame { right: 0; top: 0; width: 1100px; height: 1080px; }
      #avs .avs-in { transform-origin: 1560px 920px; }
      #bg .bg-dim {
        background:
          linear-gradient(90deg, #0d0f14 0%, rgba(13, 15, 20, 0.85) 30%, rgba(13, 15, 20, 0) 75%),
          rgba(13, 15, 20, 0.3);
      }

      #open .bar { top: 96px; height: 96px; }
      #open .bar .red { padding: 0 40px 0 100px; font-size: 52px; letter-spacing: 8px; }
      #open .bar .yel { padding: 0 34px; font-size: 44px; }
      #open .o-text { position: absolute; left: 100px; top: 270px; width: 1100px; display: flex; flex-direction: column; gap: 40px; }
      #open .sub { padding-left: 4px; font-size: 56px; }

      #hdr .bar { top: 113px; height: 64px; }
      #hdr .bar .red { padding: 0 24px 0 100px; font-size: 34px; letter-spacing: 5px; }
      #hdr .bar .yel { padding: 0 22px; font-size: 30px; }

      #brand .brand-in { right: 60px; top: 110px; font-size: 38px; }
      #brand .brand-in img { width: 70px; height: 70px; }

      .card { left: 100px; top: 230px; width: 1100px; height: 500px; gap: 30px; }
      .card .line { font-size: 52px; }

      .cap { bottom: 154px; }

      #end .end-in { gap: 18px; padding-bottom: 120px; }
      #end .end-in img { width: 180px; height: 180px; }
      #end .end-lead { font-size: 56px; }

      #ticker .tk-bar { bottom: 0; height: 120px; }
      #ticker .tk-track { padding-left: 100px; gap: 60px; font-size: 44px; }
    </style>
  </head>
  <body>
    <!--BODY-->
    <script>
      /*TIMELINE*/
    </script>
  </body>
</html>
