<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#0d0f14;position:relative;color:#fff}
.bg{position:absolute;right:0;top:0;width:1100px;height:1080px;background:url(bg.webp) center/cover;filter:brightness(.7) saturate(1.3)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d0f14 0%,rgba(13,15,20,.85) 30%,rgba(13,15,20,0) 75%)}
.bar{position:absolute;left:0;top:96px;height:96px;display:flex;align-items:center}
.bar .red{background:#e3202a;height:96px;display:flex;align-items:center;padding:0 40px 0 100px;font-size:52px;font-weight:900;letter-spacing:8px}
.bar .yel{background:#ffd23f;color:#111;height:96px;display:flex;align-items:center;padding:0 34px;font-size:44px;font-weight:900}
h1{position:absolute;left:100px;top:270px;font-size:170px;font-weight:900;line-height:1.02;letter-spacing:2px;text-shadow:0 8px 30px rgba(0,0,0,.6)}
h1 .y{color:#ffd23f}
.sub{position:absolute;left:104px;top:660px;font-size:56px;font-weight:700;color:#e6e6e6}
.ticker{position:absolute;left:0;right:0;bottom:0;height:120px;background:#1b1e27;border-top:6px solid #e3202a;display:flex;align-items:center;padding-left:100px;gap:60px;font-size:44px;font-weight:700;color:#cfd3dc}
.ticker b{color:#ffd23f}
.av{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 18px 30px rgba(0,0,0,.8))}
.wpn{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 0 22px rgba(255,210,63,.75))}
.brand{position:absolute;right:60px;top:110px;display:flex;align-items:center;gap:14px;font-size:38px;font-weight:900}
.brand img{width:70px}
</style></head><body>
<div class="bg"></div>
<div class="bar"><div class="red">快報</div><div class="yel">官方公告 11/12</div></div>
<h1>楓葉商會<br><span class="y">11/19</span> 開跑</h1>
<div class="sub">19 把楓葉武器，打怪掉硬幣就能換</div>
<img class="av" src="av1.png" style="width:330px;left:1250px;top:430px">
<img class="av" src="av2.png" style="width:300px;left:1560px;top:470px">
<img class="wpn" src="1302020.png" style="width:170px;left:1330px;top:180px;transform:rotate(-12deg)">
<img class="wpn" src="1452016.png" style="width:170px;left:1560px;top:230px;transform:rotate(10deg)">
<div class="brand"><img src="brand-emblem.png">楓谷幫手</div>
<div class="ticker"><span>最後掉幣 <b>12/9</b></span><span>最後能換 <b>12/16</b></span><span>12/17 硬幣、卷軸<b>失效</b></span></div>
</body></html>
