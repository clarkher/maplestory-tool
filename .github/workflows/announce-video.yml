name: 官網公告做片

# 官網新公告（活動、商城外觀、改版／更新；維護、開機、制裁不做）自動做快報片：
# 正片 1920×1080＋Shorts 1080×1920，用使用者的複製聲配音，放 GitHub prerelease（tag video-<公告id>，標題「待審｜…」），
# 同時公開上傳到楓谷幫手 YouTube 頻道（v2.24），在「官網公告追蹤」issue 留言附封面圖、下載連結跟 YouTube 工作室連結，使用者看完改公開。程式：pipeline/video/run.mjs。v2.22。
# 接在「官網公告追蹤」（announce-watch.yml）成功跑完後面；每則最多試 3 次，公告超過 7 天不補做。
# 手動做一則（不留言、不改 issue 狀態）：gh workflow run announce-video.yml -f bulletin_id=<id>
# 驗過聲音後補傳（v2.49，不重新 render、傳的就是那份 release；舊片改私人不刪）：
#   gh workflow run announce-video.yml -f upload_release=<id> -f hide=<舊正片id>,<舊Shorts id>

on:
  workflow_run:
    workflows: ["官網公告追蹤"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bulletin_id:
        description: "只做這一則公告（測試用；不留言、不改 issue 狀態）"
        type: string
        required: false
      dry_run:
        description: "測試用：只印要做哪幾則"
        type: boolean
        default: false
      upload_release:
        description: "不做片：把 release video-<id> 原封不動公開上傳 YouTube"
        type: string
        required: false
      hide:
        description: "跟 upload_release 一起用：要改私人的舊片 id，逗號分隔"
        type: string
        required: false

concurrency:
  group: announce-video
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'clarkher/maplestory-tool' && github.event_name == 'workflow_dispatch' && inputs.upload_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 下載 release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.upload_release }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "upload_release 要是數字"; exit 1; }
          gh release download "video-$RELEASE_ID" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/rel"
      - name: 上傳
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          HIDE: ${{ inputs.hide }}
        run: node pipeline/video/upload-release.mjs "$RUNNER_TEMP/rel" "$HIDE"

  video:
    if: >-
      github.repository == 'clarkher/maplestory-tool' &&
      (github.event_name == 'workflow_dispatch' && inputs.upload_release == '' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    env:
      VIDEO_OUT: ${{ github.workspace }}/video-out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pipeline/video 只用 Node 內建模組＋npx hyperframes，不用 npm ci
      - name: 裝 ffmpeg（字型由 ensureFonts 下載）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 字型快取
        uses: actions/cache@v4
        with:
          path: ~/.cache/maplehelper-video
          key: maplehelper-video-fonts-v1

      - name: 做片
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
          # Inworld 點數用完（402）改用 GPT shimmer 配音（v2.48）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 有這三個就把片公開上傳到楓谷幫手頻道（Google Cloud 專案 maplehelper-youtube）
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BULLETIN_ID: ${{ inputs.bulletin_id }}
          # main 以外的分支沒指定 bulletin_id 一律 dry-run，不在測試時亂留言、亂改 issue
          DRY_RUN: ${{ (inputs.dry_run || (github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.bulletin_id)) && 'true' || 'false' }}
        # 字型下載到 VIDEO_CACHE/fonts（上一步快取這個資料夾）
        run: |
          export VIDEO_CACHE="$HOME/.cache/maplehelper-video"
          node pipeline/video/run.mjs

      - name: 產物備份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-out
          path: video-out
          if-no-files-found: ignore
          retention-days: 14
