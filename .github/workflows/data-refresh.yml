name: 資料自動更新

# 雙軌更新：
#  1. 本機抽檔（data/raw/artale.local.json）—— 有的話一律優先，那是從遊戲客戶端直接抽的
#  2. 上游資料庫 —— 沒有本機抽檔時才用，每天排程比對版本，有變才重建
#
# 比對版本看兩樣東西（v1.11）：上游六個資料檔「原文」的雜湊（網站 meta.json 的 dataHash，對上取上游時算的
# data/raw/artale.json 的 metadata.contentHash，pipeline/lib/upstream.mjs），跟上游的產生時間 generatedAt。
# 光比產生時間不夠：上游作者手動修資料不會改 generatedAt（2026-10-16、10-17、10-21 三次都是），
# 以前排程一次都沒抓到。規則：勾了 force 就重建；兩邊都有雜湊時，雜湊不同或產生時間不同都重建；
# 任一邊沒有雜湊（舊的 meta.json、本機抽檔）就照舊只比產生時間，不會白白重建。
# 雜湊會進資料分支名、commit 與 PR 標題（取前 8 碼），所以一律先用 ^[0-9a-f]{64}$ 擋過才用。
#
# 刷怪點與回生秒數來自台服客戶端（上游 maps-data.js），跟遊戲資料一起在這裡更新。
# v83 地圖資料（傳送門、回城點、世界地圖區域；台服客戶端沒有刷怪資料的圖才用它的刷怪點）
# 是凍結版本，已進版控，不會在這裡重抓。
#
# 三個 job，寫入權限只在最後開 PR 那一個：
#  - refresh：取上游、重建、檢查、next build，只能讀 repo（checkout 也不留 token）——這裡跑 npm、讀第三方上游的資料，
#    萬一哪個被動了手腳也拿不到寫入權限。重建好的 public/data、public/assets 存成 artifact
#  - publish：refresh 全過、真的重建了、不是 dry-run 才跑。下載 artifact 換進 public/，開 PR、--admin 直接合進 main（正式機）。
#    不跑 npm、不跑 pipeline 的程式，artifact 只當資料收
#  - notify：失敗通知（下面）
#
# 失敗通知（notify job，pipeline/notify-refresh.mjs）：refresh 或 publish 任何一步失敗就開一張 issue
# （label「資料更新失敗」，指派給 repo 擁有者）。已經有開著的就不另開：同樣的失敗只更新內文「最後一次失敗」那行、
# 不發通知，失敗的步驟或上游版本（產生時間加內容雜湊前 8 碼）變了才留言；之後成功一次就留言並關掉。跑超過時間上限被中止也算失敗。
# 要測通知本身，手動觸發勾 dry_run（不開 PR、不合併，寫到「資料更新失敗-測試」）；勾 simulate_failure 會故意失敗一次（也算 dry-run）。
# 從 main 以外的分支手動觸發一律當 dry-run。

on:
  schedule:
    # 台灣時間每天早上 8:20 與晚上 8:20 各檢查一次
    - cron: "20 0,12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "即使版本沒變也強制重建"
        type: boolean
        default: false
      dry_run:
        description: "測試用：照跑但不開 PR、不合併，通知寫到「資料更新失敗-測試」那張 issue"
        type: boolean
        default: false
      simulate_failure:
        description: "測試用：比對版本之後故意失敗一次，測失敗通知（勾了就算 dry-run，不開 PR、不合併）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      # 有人上傳新的本機抽檔就立刻重建
      - "data/raw/artale.local.json"
      - "pipeline/**"

env:
  # dry-run：不開 PR、不合併、不推資料分支，通知寫到測試用的 issue。
  # 只勾 simulate_failure 也算；不是從 main 觸發也算——開 PR 那步的資料分支是從當下 checkout 的分支切出來的，
  # 在功能分支上手動跑忘了勾 dry_run，會把整條分支還沒審過的程式一起 --admin 合進正式機
  DRY_RUN: ${{ inputs.dry_run || inputs.simulate_failure || github.ref != 'refs/heads/main' }}

concurrency:
  # dry-run 自己排一列：同一群組只留一個排隊中的，混在一起會把正式排程擠掉（concurrency 讀不到 env，條件照抄上面）
  group: data-refresh${{ (inputs.dry_run || inputs.simulate_failure || github.ref != 'refs/heads/main') && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  # notify 用 job 名稱 refresh、publish 找失敗的步驟與 log，改名要一起改 pipeline/lib/refresh-issue.mjs 的 overallResult
  refresh:
    runs-on: ubuntu-latest
    # 平常 1～2 分鐘跑完（2026-10-07 實測：連 npm ci、next build 的完整重建加存 artifact 約 1 分 15 秒）；卡住（例如 clone 上游斷線不動）最多佔 30 分鐘，被中止後 notify 會開 issue
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # 給 notify 寫進 issue：網站目前的資料版本、上游版本（取上游那步就失敗時是空的）
      before: ${{ steps.before.outputs.stamp }}
      stamp: ${{ steps.check.outputs.stamp }}
      # 上游資料檔原文的雜湊（本機抽檔沒有就是空的）：給 publish 的分支名與標題帶前 8 碼；也給 notify，
      # 上游只改內容、產生時間沒變時，issue 才寫得出上游版本跟網站版本不同，也分得出兩次不同的內容改動
      hash: ${{ steps.check.outputs.hash }}
      # 網站更新前的內容雜湊（meta.json 的 dataHash，舊版沒有就是空的）：給 notify 跟上面的 hash 對照
      before_hash: ${{ steps.before.outputs.hash }}
      # 給 publish：上游版本有變（或勾了 force），有重建、有存 artifact
      changed: ${{ steps.check.outputs.changed }}
      # 給 notify：跟新資料對不上、這次建置被拿掉的攻略文（空白隔開，例 230-31-50 110-31-50）
      broken_articles: ${{ steps.articles.outputs.broken_articles }}
    steps:
      # 不把 token 留在 .git/config：這個 job 用不到，留著就是給後面跑的程式拿
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 記下更新前的版本
        id: before
        run: |
          if [ -f public/data/meta.json ]; then
            echo "stamp=$(node -p "require('./public/data/meta.json').dataGeneratedAt ?? ''")" >> "$GITHUB_OUTPUT"
            # 上游資料檔的雜湊（build.mjs 寫進 meta.json 的 dataHash）：只收 64 位小寫 hex，舊版 meta.json 沒有、格式不對都當成沒有
            echo "hash=$(node -p 'const h = require("./public/data/meta.json").dataHash; typeof h === "string" && /^[0-9a-f]{64}$/.test(h) ? h : ""')" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=" >> "$GITHUB_OUTPUT"
            echo "hash=" >> "$GITHUB_OUTPUT"
          fi

      - name: 取得 Artale 資料
        run: node pipeline/fetch-artale.mjs

      # run 裡不要直接寫 ${{ }}：那是在 bash 跑之前把字串原樣貼進指令，上游的版本字串寫成 `"; 指令; echo "`
      # 就會在這裡被執行。一律用 env 傳進去、指令裡寫 "$變數"（pipeline/lib/data-refresh-workflow.test.mjs 會擋）
      - name: 比對版本
        id: check
        env:
          BEFORE: ${{ steps.before.outputs.stamp }}
          BEFORE_HASH: ${{ steps.before.outputs.hash }}
          FORCE: ${{ inputs.force }}
        run: |
          AFTER=$(node -p "require('./data/raw/artale.json').metadata?.generatedAt ?? ''")
          AFTER_HASH=$(node -p "require('./data/raw/artale.json').metadata?.contentHash ?? ''")
          # 雜湊會進分支名、PR 標題：不是 64 位小寫 hex 就當成沒有（本機抽檔、舊版 meta.json 本來就沒有）
          if ! [[ "$AFTER_HASH" =~ ^[0-9a-f]{64}$ ]]; then AFTER_HASH=""; fi
          if ! [[ "$BEFORE_HASH" =~ ^[0-9a-f]{64}$ ]]; then BEFORE_HASH=""; fi
          echo "stamp=$AFTER" >> "$GITHUB_OUTPUT"
          echo "hash=$AFTER_HASH" >> "$GITHUB_OUTPUT"
          # 兩邊都有雜湊才比內容（上游手動修資料不會改產生時間）；產生時間不同照舊算有變，所以不會比以前少抓
          if [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "手動勾了 force，強制重建（上游版本 $AFTER）"
          elif [ -n "$BEFORE_HASH" ] && [ -n "$AFTER_HASH" ] && [ "$AFTER_HASH" != "$BEFORE_HASH" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ "$AFTER" = "$BEFORE" ]; then
              echo "上游產生時間沒變（$AFTER），但資料檔內容變了（${BEFORE_HASH:0:8} → ${AFTER_HASH:0:8}），重建"
            else
              echo "上游資料檔內容變了（${BEFORE_HASH:0:8} → ${AFTER_HASH:0:8}），產生時間也從 $BEFORE 變成 $AFTER，重建"
            fi
          elif [ "$AFTER" != "$BEFORE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游產生時間從 $BEFORE 變成 $AFTER，重建"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ -n "$BEFORE_HASH" ] && [ -n "$AFTER_HASH" ]; then
              echo "上游產生時間（$AFTER）跟資料檔內容（${AFTER_HASH:0:8}）都沒變，跳過重建"
            else
              echo "上游版本沒變（$AFTER），跳過重建（網站或上游沒有內容雜湊，只比了產生時間）"
            fi
          fi

      - name: （測試）故意失敗
        if: inputs.simulate_failure
        run: |
          echo "dry-run 測試：勾了 simulate_failure，故意在這裡失敗，看失敗通知有沒有開出來"
          echo "Error: 這是模擬的錯誤訊息，不是真的壞掉"
          exit 1

      - name: 安裝相依套件
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: 重建資料檔
        if: steps.check.outputs.changed == 'true'
        run: node pipeline/build.mjs

      # 改版整理（/updates，v1.94）：拿剛建好的 public/data 跟上游「前一個不同版號」的最後一個 commit 重建結果比，
      # 寫 public/data/patches/<目前版本>.json 與 index.json（跟著整個 public/data 進 artifact、publish）。
      # 上游另 clone 一份 blob:none 的到 data/cache/upstream-history，不把 data/cache/upstream 補成完整歷史：
      # 那份是 depth 1 的一般 clone，fetch-artale.mjs 每次 fetch --depth 1＋reset，unshallow 會連每一版的圖檔、資料檔全下載；
      # blob:none 只抓 commit 跟目錄，要看哪一版的檔才下載那一版（跟本機回填 backfill-patches.mjs 同一個做法）。
      # --head 鎖在 data/cache/upstream 的 HEAD：兩次 clone 中間上游剛好推了新 commit，也不會拿別的版本來比。
      # 算不出來不擋資料更新（clone 失敗、重建前一版失敗…）：印 ::warning::、這步照樣成功，public/data/patches 維持原樣
      # （refresh-patch.mjs 先寫暫存、全成功才搬進去）。找不到前一版只印一行
      - name: 重算目前版本的改版差異
        if: steps.check.outputs.changed == 'true'
        run: |
          if [ ! -d data/cache/upstream/.git ]; then
            echo "改版差異跳過：這次沒有用上游（本機抽檔）"
            exit 0
          fi
          rm -rf data/cache/upstream-history
          if ! git clone --filter=blob:none --no-checkout --quiet "$(git -C data/cache/upstream remote get-url origin)" data/cache/upstream-history; then
            echo "::warning::改版差異沒算（資料照常更新）：上游歷史 clone 失敗"
            exit 0
          fi
          if ! node pipeline/refresh-patch.mjs --upstream data/cache/upstream-history --head "$(git -C data/cache/upstream rev-parse HEAD)"; then
            echo "::warning::改版差異沒算（資料照常更新）：refresh-patch.mjs 結束碼不是 0"
          fi

      - name: 轉地圖畫面圖（webp）
        if: steps.check.outputs.changed == 'true'
        run: node pipeline/build-map-renders.mjs

      - name: 重編玩家攻略（遊戲資料變了要重新驗 id）
        if: steps.check.outputs.changed == 'true'
        run: node pipeline/build-guides.mjs

      - name: 重編能力值＋裝備＋衝卷資料
        if: steps.check.outputs.changed == 'true'
        run: node pipeline/build-gear.mjs

      - name: 重算未來視的材料清單
        if: steps.check.outputs.changed == 'true'
        run: node pipeline/build-future.mjs

      - name: 確認產出沒有壞掉
        if: steps.check.outputs.changed == 'true'
        run: node pipeline/verify.mjs

      # 拿新資料跑全套測試（跟 PR 的「單元測試」同一套：pipeline 的 node --test＋vitest 全部）：首頁每個職業 × 等級
      # （主推都有、組隊任務在遊戲等級限制內、帶我去走得到…）、傷害計算機、技能卡、道具「哪裡買得到」都拿新資料驗。壞了就不開 PR。
      # 2026-10-15 只跑首頁那一支（now-plan-realdata）：上游 2.0.0 漏抽熟練度、計算機算錯照樣合進正式機（#129），
      # dev 的完整測試才抓到 29 項紅（使用者 10/16 選 5 改成全套）
      # --reporter=default：vitest 在 GitHub Actions 上預設會在摘要之後再印一串標註，失敗一多，
      # 通知 issue 裡「錯誤訊息最後 30 行」就只剩標註、看不到哪個組合壞了
      # SPEED_NAMES_MAY_LAG：練功測速的地圖名樣板要在 Windows 產（微軟正黑體），新地圖還沒有樣板不擋自動更新（v1.10，read-map.test.ts 那一項跳過）
      # 不跑 job-article.test.ts：攻略文跟新資料對不上時只拿掉那一篇、下面開 issue，不擋整站的資料更新（v1.43）；那支測試平常開 PR 時照跑
      - name: 全套測試（含首頁每個組合的真資料檢查）
        if: steps.check.outputs.changed == 'true'
        env:
          SPEED_NAMES_MAY_LAG: "1"
        run: |
          node --test --test-reporter=spec "pipeline/**/*.test.mjs"
          npx vitest run --reporter=default --exclude "**/job-article.test.ts"

      # 跟新資料對不上的攻略文，建置時會被拿掉；這裡把篇名交給 notify 開 issue。有文章壞掉不算失敗
      - name: 攻略文跟新資料對不對得上
        id: articles
        if: steps.check.outputs.changed == 'true'
        run: node scripts/job-article-check.mjs

      - name: 建置一次確保網站編得過
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      # publish 拿這份開 PR：只放重建的產出這兩個資料夾，留一天就好。dry-run 也存（publish 不會跑），存不存得起來照樣驗得到
      - name: 存下重建好的資料檔
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refresh-data
          path: |
            public/data
            public/assets
          if-no-files-found: error
          retention-days: 1

  # 寫入權限只在這個 job：把 refresh 建好、檢查過的資料檔換進 public/，開 PR、--admin 直接合進 main（正式機）。
  # 不跑 npm、不跑 pipeline 的程式、不還原快取：artifact 是 refresh 產的（那邊跑過 npm、讀過上游），這裡只當資料收
  publish:
    needs: refresh
    # dry-run 整個 job 不跑；job 的 if 讀不到 env，dry-run 的條件照抄開頭那個（測試會比對）。
    # 沒寫 always() 這類條件：refresh 有任何一步失敗（檢查沒過）就不跑
    if: needs.refresh.outputs.changed == 'true' && !(inputs.dry_run || inputs.simulate_failure || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    # 下載 artifact、commit、開 PR 合併，平常 20 秒上下（2026-10-07 實測 18 秒）
    timeout-minutes: 15
    permissions:
      contents: write # 推資料分支、合併
      pull-requests: write # 開 PR
    outputs:
      # 給 notify：合併成功、而且這次有 public/data/patches/<版本>.json 時是那個版本（已擋過格式），否則空的
      patch_version: ${{ steps.pr.outputs.patch_version }}
    steps:
      # 這裡要留 token：後面 git push 用
      - uses: actions/checkout@v4

      - name: 下載重建好的資料檔
        uses: actions/download-artifact@v4
        with:
          name: refresh-data
          path: ${{ runner.temp }}/refresh-data

      - name: 開 PR 並自動合併
        id: pr
        if: needs.refresh.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.refresh.outputs.stamp }}
          HASH: ${{ needs.refresh.outputs.hash }}
        run: |
          # 這一步會用 --admin 直接合進 main（正式機），dry-run 絕不能走到這裡：job 條件、步驟條件之外再擋一次
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run：不開 PR、不合併"
            exit 0
          fi
          # artifact 只當資料收：只能有 data、assets 兩個資料夾，裡面只能是 png、json、webp（地圖畫面；跟 pipeline/lib/assets.mjs 的 PUBLISH_EXTENSIONS 一樣；
          # .html、.svg 放上正式機網域就是 stored XSS，.js 可能被當成程式載入）。隱藏檔、連結正常上傳時就會被丟掉、換成檔案內容，
          # 這裡再擋一次是防 refresh 被動了手腳、自己做的 artifact
          DATA="$RUNNER_TEMP/refresh-data"
          BAD=$(find "$DATA" -mindepth 1 \( -name '.*' -o ! -type f ! -type d -o -type f ! -name '*.png' ! -name '*.json' ! -name '*.webp' \) -print -quit)
          if [ "$(ls -A "$DATA" | tr '\n' ' ')" != "assets data " ] || [ ! -d "$DATA/data" ] || [ ! -d "$DATA/assets" ] || [ -n "$BAD" ]; then
            echo "下載的資料檔不對：只能有 data、assets 兩個資料夾，裡面只能是 png、json、webp（不能有隱藏檔、連結）"
            exit 1
          fi
          rm -rf public/data public/assets
          mv "$DATA/data" public/data
          mv "$DATA/assets" public/assets
          git config user.name "maplestory-tool bot"
          git config user.email "actions@github.com"
          git add public/data public/assets
          if git diff --cached --quiet; then
            echo "檔案內容其實沒變，不用提交"
            exit 0
          fi
          # 只當文字讀、自己 JSON.parse：不能用 require——找不到 meta.json 時它會改載 meta.json.js、資料夾裡的 index.js，等於執行 artifact 帶來的程式
          VERSION=$(node -e 'const meta = JSON.parse(require("fs").readFileSync("public/data/meta.json", "utf8")); process.stdout.write(String(meta.gameVersion ?? "?"))')
          # 要寫進分支名、commit 訊息、PR 標題的字串，開分支前再擋一次（上游來的 upstream.mjs 擋過格式，本機抽檔不經過那裡）：
          # 太長開 PR 會被 GitHub 拒（標題上限 256 字），那時資料分支已經推上去了
          # 內容雜湊（上游資料檔原文的 sha256）可以是空的（本機抽檔沒有），有的話一定是 64 位小寫 hex
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]{1,32}$ ]] || ! [[ "$STAMP" =~ ^[0-9A-Za-z.:+-]{1,40}$ ]] || { [ -n "$HASH" ] && ! [[ "$HASH" =~ ^[0-9a-f]{64}$ ]]; }; then
            echo "遊戲版本、上游版本或內容雜湊的字串不對（長度 ${#VERSION}、${#STAMP}、${#HASH}），不開 PR"
            exit 1
          fi
          BRANCH="data/refresh-$(echo "$STAMP" | tr -dc '0-9' | head -c 14)"
          LABEL="$STAMP"
          # 上游只改資料、產生時間沒變時，分支名跟標題只靠時間會跟上一次一樣：帶雜湊前 8 碼
          if [ -n "$HASH" ]; then
            BRANCH="${BRANCH}-${HASH:0:8}"
            LABEL="${STAMP}，內容 ${HASH:0:8}"
          fi
          git checkout -b "$BRANCH"
          git commit -m "data: 同步遊戲版本 ${VERSION}（${LABEL}）"
          # 上一輪推了同一條分支、卻在開 PR 或合併時失敗（或手動 Re-run）：先刪掉舊的（它開著的 PR 會跟著關），不然推不上去、要人工清
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git push origin --delete "$BRANCH"
          fi
          git push -u origin "$BRANCH"
          # refresh 的 verify.mjs、全套測試、next build 全過才會走到這裡，PR 開了就直接合
          gh pr create --title "data: 同步遊戲版本 ${VERSION}（${LABEL}）" \
            --body "自動資料更新。verify.mjs 與全套測試全數通過、next build 成功。合併後 Vercel 會自動部署。" \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch --admin
          # 合併成功才走到這裡：這一版有改版差異檔，就交給 notify 看要不要開 issue 提醒寫重點
          if [ -f "public/data/patches/${VERSION}.json" ]; then
            echo "patch_version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: [refresh, publish]
    # refresh、publish 成功失敗都要跑（失敗開／留言，成功關）；publish 沒跑（dry-run、版本沒變）也跑；整個被取消就不跑
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # 拿 pipeline/notify-refresh.mjs
      issues: write # 開 issue、留言、關閉、建 label
      actions: read # 讀 refresh、publish 是哪一步失敗、下載它的 log
    steps:
      # src/content/patches：看這一版的改版重點寫了沒（新版本開 issue 提醒那步）
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            src/content/patches

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # DRY_RUN 用 workflow 開頭 env 那一個（dry-run 寫到測試用的 issue）
      - name: 失敗開 issue、成功關 issue
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          UPSTREAM_STAMP: ${{ needs.refresh.outputs.stamp }}
          UPSTREAM_HASH: ${{ needs.refresh.outputs.hash }}
          SITE_STAMP: ${{ needs.refresh.outputs.before }}
          SITE_HASH: ${{ needs.refresh.outputs.before_hash }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: node pipeline/notify-refresh.mjs

      # 攻略文被拿掉不算更新失敗，另外開一張 issue。篇名是 refresh 那邊來的，只放行數字、連字號、空白再用；內容走 env，不寫進 run
      - name: 攻略文被新資料打壞就開 issue
        if: ${{ needs.refresh.outputs.broken_articles != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BROKEN: ${{ needs.refresh.outputs.broken_articles }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          case "$BROKEN" in
            *[!0-9\ -]*) echo "篇名格式不對，不開 issue"; exit 1 ;;
          esac
          TITLE="攻略文跟新資料對不上"
          if [ "$DRY_RUN" = "true" ]; then TITLE="$TITLE-測試"; fi
          BODY="這幾篇已經從網站拿掉（頁面、職業頁連結、網站地圖都不列），其他資料照常更新：$BROKEN。本機跑 npm run article:check 看哪裡不對，改好文字跟 assumes 就會回來。"
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$ASSIGNEE"
          fi

      # 改版整理（v1.94）：資料更新合進正式機、這一版有改版差異檔、src/content/patches/<版本>.md 還沒寫，就開 issue 提醒寫重點
      # （沒寫重點的版本 /updates 不會出現）。同標題開著的就不再開。版本字串是 publish 擋過格式才給的，這裡再擋一次
      - name: 新版本提醒寫改版重點
        if: ${{ needs.publish.result == 'success' && needs.publish.outputs.patch_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.patch_version }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]{1,32}$ ]]; then
            echo "版本字串不對（長度 ${#VERSION}），不開 issue"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run：不開改版重點提醒"
            exit 0
          fi
          if [ -f "src/content/patches/$VERSION.md" ]; then
            echo "$VERSION 的改版重點已經寫了，不用提醒"
            exit 0
          fi
          TITLE="新版本 $VERSION 要寫改版重點"
          # 搜尋是模糊比對：拿回標題自己比，完全一樣才算已經開著
          if gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "「$TITLE」已經開著，不再開"
            exit 0
          fi
          BODY="資料自動更新已經把 $VERSION 的改版差異（public/data/patches/$VERSION.json）合進正式機，但還沒有改版重點，/updates 不會列這一版。寫好 src/content/patches/$VERSION.md 合進去就會出現。"
          gh issue create --title "$TITLE" --body "$BODY" --assignee "$ASSIGNEE"
